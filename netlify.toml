[build]
  publish = "public"
  functions = "netlify/functions"

# Friendly URLs for the backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The admin page is protected by a password check inside the function,
# but keep it out of search results regardless.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
